name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install bubblewrap (Linux agent sandbox)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      - run: npm ci

      - name: CLI tests
        run: npm run test:cli

      - name: Crypto tests
        run: npm run test:crypto

      - name: Package dry run
        run: npm pack --dry-run --workspace=@rabbitlock/cli
